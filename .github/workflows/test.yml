name: Test
on:
    workflow_run:
        workflows: ["CI"]
        types: ["completed"]
jobs:
    tests:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion== 'success'}}
        steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: "3.11"
        - run:
            pip install -r  requirements.txt
            pytest